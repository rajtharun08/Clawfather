name: Update The Clawfather Syndicate Status

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'output/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  render-syndicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Profile Scene GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: |
          python src/compositor.py

      - name: Commit and Push Updated Tracker
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/profile_tracker.gif
          git diff --staged --quiet || (git commit -m "chore(clawfather): evolve syndicate status [skip ci]" && git push)
